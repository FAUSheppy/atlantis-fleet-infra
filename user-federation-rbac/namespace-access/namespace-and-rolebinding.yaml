---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opendesk-to-opendesk-binding
  namespace: opendesk-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: Group
    name: keycloakoidc_group://opendesk
    apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opendesk-dev-namespace-view
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["opendesk-dev"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opendesk-dev-namespace-view
subjects:
  - kind: Group
    name: keycloakoidc_group://opendesk
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: opendesk-dev-namespace-view
  apiGroup: rbac.authorization.k8s.io
