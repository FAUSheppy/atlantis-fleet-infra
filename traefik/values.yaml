
additionalArguments:
  - --api.insecure=true
  - --api.dashboard=true
  - --ping=true
  - --entrypoints.websecure.proxyProtocol.trustedIPs=0.0.0.0
  - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=0
  - --entrypoints.websecure.transport.respondingTimeouts.writeTimeout=0
  - --entrypoints.websecure.transport.respondingTimeouts.idleTimeout=10m
  - --accesslog=true

deployment:
  podAnnotations:
    prometheus.io/port: "8082"
    prometheus.io/scrape: "true"

# Use the chart's default Traefik v3 image.
# Do not retain the old rancher/mirrored-library-traefik:2.11.18 pin.

ingressRoute:
  dashboard:
    enabled: true

ingressClass:
  enabled: true
  isDefaultClass: true

priorityClassName: system-cluster-critical

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true

ports:
  beats:
    port: 5044
    exposedPort: 5044
    protocol: TCP
    expose:
      default: true

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

service:
  spec:
    type: LoadBalancer
    ipFamilyPolicy: PreferDualStack

tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
  - effect: NoSchedule
    key: node-role.kubernetes.io/control-plane
    operator: Exists
  - effect: NoSchedule
    key: node-role.kubernetes.io/master
    operator: Exists

