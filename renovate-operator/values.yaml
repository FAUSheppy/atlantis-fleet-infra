replicaCount: 1

ingress:
  enabled: true
  ingressClassName: traefik

  host: renovate.services.atlantishq.de

  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

  tls:
    - hosts:
        - renovate.services.atlantishq.de
      secretName: renovate-services-atlantishq-de-tls


auth:
  oidc:
    enabled: true

    issuerUrl: "https://keycloak.atlantishq.de/realms/master"
    clientId: "renovate"

    existingSecret: renovate-oidc-config
    secretKey: client-secret

    redirectScheme: https

    pkceEnabled: true

    groupsClaim: groups

authorization:
  enabled: false
  defaults:
    readerGroups: []
    adminGroups:
      - atlantis-admins

    readerUsers: []
    adminUsers: []

    anonymousRead: false
    anonymousReadLogs: false


valkey:
  enabled: false


resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
