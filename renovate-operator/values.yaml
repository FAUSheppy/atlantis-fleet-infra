replicaCount: 1

ingress:
  enabled: true
  ingressClassName: traefik
  host: renovate.services.atlantishq.de
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

  tls:
    - hosts:
        - renovate.services.atlantishq.de
      secretName: renovate-services-atlantishq-de-tls

webhook:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: traefik
    host: renovate-webhook.services.atlantishq.de
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    tls:
      - hosts:
          - renovate-webhook.services.atlantishq.de
        secretName: renovate-webhook-tls

auth:
  oidc:
    enabled: true

    issuerUrl: "https://keycloak.atlantishq.de/realms/master"
    clientId: "renovate"

    existingSecret: renovate-oidc-config
    secretKey: client-secret

    redirectScheme: https

    pkceEnabled: true

    groupsClaim: groups

authorization:
  enabled: true
  defaults:
    readerGroups: []
    adminGroups:
      - atlantis-admins

    readerUsers: []
    adminUsers: []

    anonymousRead: false
    anonymousReadLogs: false


valkey:
  enabled: false


resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
